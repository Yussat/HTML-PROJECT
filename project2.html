<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      padding: 20px 0;
      font-family: Arial, sans-serif;
    }

    /* Carousel window */
    .carousel-viewport {
      width: 100%;
      overflow: hidden;
      padding: 10px 0 25px;
    }

    /* Slides move horizontally */
 
.carousel-viewport {
  width: 100%;
  overflow: hidden;
  padding: 10px 0 25px;
}

.carousel-track {
  display: flex;
  align-items: center;
  gap: 16px;
  transition: transform 0.5s ease;
  will-change: transform;
}

.carousel-slide {
  flex: 0 0 88%;
  min-width: 0;
  display: flex;
  justify-content: center;
}


.image-grid {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: auto auto;
  gap: 10px;
  align-items: stretch;
}

.large-box {
  aspect-ratio: 680 / 423;
}

.small-box {
  aspect-ratio: 332 / 423;
}

/* Top row: big image, then small image */
.image-box:nth-child(1) {
  grid-column: 1 / 3;
  grid-row: 1;
}

.image-box:nth-child(2) {
  grid-column: 3;
  grid-row: 1;
}

/* Bottom row: small image, then big image */
.image-box:nth-child(3) {
  grid-column: 1;
  grid-row: 2;
}

.image-box:nth-child(4) {
  grid-column: 2 / 4;
  grid-row: 2;
}

.image-box {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  border: 1px solid #ddd;
  transition: box-shadow 0.4s ease;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
  cursor: pointer;
}

.image-box:hover {
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
}

.image-box:hover img {
  transform: scale(1.08);
}

.image-box {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  border: 1px solid #ddd;
  transition: box-shadow 0.4s ease;
}

.large-box {
  aspect-ratio: 680 / 423;
  grid-column: span 2;
}

.small-box {
  aspect-ratio: 332 / 423;
  grid-column: span 1;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
  cursor: pointer;
}

.image-box:hover {
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
}

.image-box:hover img {
  transform: scale(1.08);
}

.carousel-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 12px;
}

.carousel-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #f0f0f0;
  font-size: 24px;
  cursor: pointer;
}

.carousel-btn:hover {
  background: #ddd;
}

.carousel-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

@media (max-width: 576px) {
  .carousel-slide {
    flex-basis: 92%;
  }

  .image-grid {
    gap: 5px;
  }

  .image-box {
    border-radius: 8px;
  }
}

  </style>
</head>

<body>

    <!-- Previous and Next buttons -->
    <div class="carousel-controls">
      <button class="carousel-btn" id="prevBtn"
              aria-label="Previous slide">&#8592;</button>

      <button class="carousel-btn" id="nextBtn"
              aria-label="Next slide">&#8594;</button>
    </div>

  </div>

  <script>

const track = document.getElementById("carouselTrack");
const slides = document.querySelectorAll(".carousel-slide");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentIndex = 0;

function updateCarousel() {
  const slide = slides[currentIndex];

  // Centre the active slide in the viewport
  const viewport = track.parentElement;
  const slideCenter = slide.offsetLeft + slide.offsetWidth / 2;
  const viewportCenter = viewport.clientWidth / 2;

  let position = slideCenter - viewportCenter;

  // Keep the carousel movement within its limits
  const maxPosition = track.scrollWidth - viewport.clientWidth;
  position = Math.max(0, Math.min(position, maxPosition));

  track.style.transform = `translateX(-${position}px)`;

  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === slides.length - 1;
}

nextBtn.addEventListener("click", function () {
  if (currentIndex < slides.length - 1) {
    currentIndex++;
    updateCarousel();
  }
});

prevBtn.addEventListener("click", function () {
  if (currentIndex > 0) {
    currentIndex--;
    updateCarousel();
  }
});

window.addEventListener("resize", updateCarousel);

updateCarousel();

  </script>
